<!doctype html>
<html>
<head>
    <meta charset="utf-8" name="viewport" content="width=device-width, initial-scale=1">
    <title>StudyBuddy Pro</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
    <div style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
        <h1>🚀 StudyBuddy</h1>
        <button id="themeToggle" style="background: transparent; border: 1px solid var(--accent); color: var(--accent); font-size: 12px;">🌓 Theme</button>
    </div>

    <textarea id="studyText" rows="8" placeholder="Paste your notes here..."></textarea>
    <div style="display: flex; gap: 15px; align-items: center;">
        <label><input type="checkbox" id="useAI" checked> Use AI</label>
        <button id="makeCards">Make Flashcards</button>
        <button id="makeQuiz">Make Quiz</button>
    </div>

    <h2>Flashcards</h2>
    <div id="cards" class="cards-container"></div>

    <h2>Quiz</h2>
    <div id="quiz"></div>

    <h2>Code Lab</h2>
    <select id="codeLanguage">
        <option value="javascript">JavaScript</option>
        <option value="python">Python</option>
        <option value="cpp">C++</option>
    </select>
    <textarea id="codeInput" rows="8" placeholder="Paste code here..."></textarea>
    <div style="display: flex; gap: 10px; margin-top: 10px;">
        <button id="findBugBtn">Find Bug</button>
        <button id="explainCodeBtn">Create 'Explain code' Card</button>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
